openapi: 3.0.3
info:
  title: Sitwise API
  version: "1"
  description: >
    Flask API on Vercel. All routes are under /api, JSON in and out, "schema": 1 in payloads.
    Mirrors: web/src/types.ts and ios/Sitwise/Models/Types.swift. Human-readable notes: docs/api.md.
    Model-owned routes (/model/*) are STUBS that return fixed mock data with "stub": true.
servers:
  - url: /api
components:
  securitySchemes:
    dashboardToken: { type: http, scheme: bearer, description: "Browser token from POST /pair/create" }
    deviceToken: { type: http, scheme: bearer, description: "Phone token from POST /pair/claim" }
    receiverToken: { type: http, scheme: bearer, description: "Limited token for an additional phone's web-push subscription" }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            issues: { type: array, items: { type: string }, description: "Structured reasons, e.g. why a posture was refused (posture_not_good)" }
    PostureState: { type: string, enum: [AWAY, GOOD, DEVIATING, SLOUCHING] }
    Features:
      type: object
      description: Units and angle conventions are owned by the model; the server stores any numeric keys.
      properties:
        neckAngle: { type: number }
        torsoAngle: { type: number }
        headForwardOffset: { type: number }
    PostureSample:
      type: object
      required: [sessionId, t, label]
      properties:
        schema: { type: integer, enum: [1] }
        sessionId: { type: string, format: uuid, description: "New one per monitoring run" }
        t: { type: integer, format: int64, description: "Epoch ms, phone clock. Rejected if >1h from server time" }
        label: { type: string, enum: [GOOD, SLOUCHING, AWAY, UNKNOWN] }
        deviation: { type: number, minimum: 0, nullable: true, description: "0 = goal posture; higher = worse. The server compares it with the USER's sensitivity" }
        confidence: { type: number, minimum: 0, maximum: 1, default: 1, description: "Below 0.5 is ignored" }
        features: { $ref: "#/components/schemas/Features" }
        source: { type: string, maxLength: 80, description: "Optional: which model produced this reading (e.g. posture-pipeline/side-angle-rule@0.1.0). Kept with the latest sample; invalid values are ignored" }
    CalibrationBaseline:
      type: object
      required: [goal, tolerance, capturedAt]
      description: >
        goal.torsoAngle (REQUIRED) is the spine/back angle used by the calibration gate: trunk inclination from
        vertical in degrees, 0 upright, positive leaning forward, negative leaning back. Values must be finite numbers.
        The server refuses a baseline whose back angle is more than 10 degrees from upright in EITHER direction (too far forward or too far back).
      properties:
        schema: { type: integer, enum: [1] }
        goal: { $ref: "#/components/schemas/Features" }
        tolerance: { type: number, exclusiveMinimum: true, minimum: 0 }
        capturedAt: { type: integer, format: int64 }
        accepted:
          type: boolean
          description: >
            Calibration gate (optional, default true). The model's verdict on whether the captured posture is a
            GOOD goal posture. false means "do not store": PUT /calibration answers 422 posture_not_good.
        issues:
          type: array
          items: { type: string }
          description: Human-readable reasons when accepted is false (shown to the user). Not stored.
        stub: { type: boolean }
        source: { type: string, description: "The live model that measured it (present when stub is false)" }
    Settings:
      type: object
      properties:
        schema: { type: integer, enum: [1] }
        slouchThresholdSec: { type: integer, minimum: 5, maximum: 900, default: 30 }
        sensitivity: { type: number, minimum: 0, maximum: 1, default: 0.5 }
        alertChannels:
          type: object
          properties: { phone: { type: boolean }, desktop: { type: boolean } }
        cooldownSec: { type: integer, minimum: 15, maximum: 3600, default: 120 }
        quietHours:
          type: object
          properties:
            enabled: { type: boolean }
            start: { type: string, example: "22:00" }
            end: { type: string, example: "07:00" }
        tzOffsetMin: { type: integer, minimum: -840, maximum: 840, description: "Minutes east of UTC; used for quiet hours and local-day bucketing" }
        nudgeTone: { type: string, enum: [gentle, neutral, direct], default: gentle, description: "Wording of the nudge notifications" }
        focus:
          type: object
          description: "Focus mode. With onlyDuringFocus on, nudges fire only while a session started with POST /focus is running (untilMs is in the future). Posture is tracked either way."
          properties:
            onlyDuringFocus: { type: boolean, default: false }
            untilMs: { type: integer, format: int64, default: 0, description: "End of the running focus session (epoch ms, server clock); 0 = none. Set via POST /focus, not PUT." }
    ChannelResult:
      type: object
      properties:
        sent: { type: integer }
        failed: { type: integer }
        skipped: { type: string, nullable: true, description: "e.g. no_device_registered, apns_not_configured, no_browser_subscribed, vapid_not_configured" }
    IngestResponse:
      type: object
      properties:
        schema: { type: integer }
        state: { $ref: "#/components/schemas/PostureState" }
        stateSince: { type: integer, format: int64, nullable: true }
        serverTime: { type: integer, format: int64 }
        alert:
          nullable: true
          type: object
          properties:
            level: { type: integer, description: "1 first nudge, 2-3 gentle escalations" }
            channels: { type: object, additionalProperties: { $ref: "#/components/schemas/ChannelResult" } }
    DaySummary:
      type: object
      properties:
        score: { type: integer, nullable: true, minimum: 0, maximum: 100 }
        goodPct: { type: number, nullable: true }
        seatedSec: { type: integer }
        goodSec: { type: integer }
        graceSec: { type: integer }
        slouchSec: { type: integer }
        awaySec: { type: integer }
        slouchEvents: { type: integer }
        slouchEventsPerHour: { type: number, nullable: true }
        longestGoodStreakSec: { type: integer }
        avgRecoverySec: { type: number, nullable: true }
        sittingSec: { type: integer, description: "Only on /status: time since the last break of 2+ minutes" }
    Status:
      type: object
      properties:
        schema: { type: integer }
        paired: { type: boolean }
        calibrated: { type: boolean }
        serverTime: { type: integer, format: int64 }
        thresholdSec: { type: number }
        device:
          type: object
          properties:
            lastSeenMs: { type: integer, nullable: true }
            ageSec: { type: number, nullable: true }
            online: { type: boolean }
        state: { $ref: "#/components/schemas/PostureState" }
        rawState: { $ref: "#/components/schemas/PostureState" }
        stale: { type: boolean, description: "No sample for >15 s; state is reported as AWAY" }
        timeInStateSec: { type: number }
        deviatingForSec: { type: number, nullable: true }
        inCooldown: { type: boolean }
        alertsSent: { type: integer }
        sample: { type: object, nullable: true }
        today: { $ref: "#/components/schemas/DaySummary" }
    Metrics:
      type: object
      properties:
        schema: { type: integer }
        range: { type: string, enum: [day, week, month] }
        since: { type: integer }
        until: { type: integer }
        tzOffsetMin: { type: integer }
        summary: { $ref: "#/components/schemas/DaySummary" }
        previous:
          type: object
          properties: { score: { type: integer, nullable: true }, goodPct: { type: number, nullable: true }, seatedSec: { type: integer } }
        daily:
          type: array
          items:
            type: object
            properties: { date: { type: string }, dayIndex: { type: integer }, seatedSec: { type: integer }, goodPct: { type: number, nullable: true }, score: { type: integer, nullable: true } }
        heatmap:
          type: array
          description: Weekday x hour cells with data. day 0 = Monday.
          items:
            type: object
            properties: { day: { type: integer }, hour: { type: integer }, seatedSec: { type: integer }, goodPct: { type: number, nullable: true } }
        timeline:
          type: array
          description: Only for range=day.
          items:
            type: object
            properties: { state: { $ref: "#/components/schemas/PostureState" }, start: { type: integer }, end: { type: integer } }
        dayStreak: { type: integer }
        goal:
          type: object
          properties: { previousPct: { type: number, nullable: true }, currentPct: { type: number, nullable: true }, targetPct: { type: integer } }
        outlook:
          type: object
          properties: { status: { type: string, enum: [on_track, at_risk, no_data] }, thresholdPct: { type: integer } }
        sittingSec: { type: integer }
  responses:
    Unauthorized:
      description: Missing or invalid token
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
paths:
  /health:
    get:
      summary: Liveness + which store/dev routes are on + whether the database works (public; non-sensitive)
      responses: { "200": { description: "{ok, devRoutes, store: memory|postgres, db: {ok, problem: null|schema_missing|connect_failed|error}}" } }
  /pair/create:
    post:
      summary: New anonymous user + dashboard token + pairing code. With a dashboard token, only issues a fresh code.
      responses:
        "200":
          description: "{dashboardToken?, pairingCode, expiresAt} (code valid 10 min)"
  /pair/claim:
    post:
      summary: Exchange the pairing code for a device token (one phone per user; replaces the old one)
      requestBody:
        content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string } } } } }
      responses:
        "200": { description: "{deviceToken}" }
        "404": { description: invalid_code }
  /posture/ingest:
    post:
      summary: Receive a PostureSample, run the state machine, store events, fire alerts
      security: [{ deviceToken: [] }]
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/PostureSample" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/IngestResponse" } } } }
        "400": { description: "bad_sample | clock_skew" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: sessionId belongs to another user }
  /status:
    get:
      summary: Current state for the dashboard (poll ~2 s). Staleness is computed on read.
      security: [{ dashboardToken: [] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Status" } } } }
  /settings:
    get:
      summary: Read settings (defaults filled in)
      security: [{ dashboardToken: [] }, { deviceToken: [] }]
      responses: { "200": { description: "{settings}" } }
    put:
      summary: Partial update; unknown keys ignored; any invalid value rejects the whole patch (400 invalid_settings)
      security: [{ dashboardToken: [] }, { deviceToken: [] }]
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/Settings" } } }
      responses: { "200": { description: "{settings}" } }
  /calibration:
    get:
      summary: Read the goal-posture baseline
      security: [{ dashboardToken: [] }, { deviceToken: [] }]
      responses: { "200": { description: "{calibrated, baseline|null}" } }
    put:
      summary: "Store a baseline produced by the model (only if it was accepted: the calibration gate)"
      security: [{ dashboardToken: [] }, { deviceToken: [] }]
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/CalibrationBaseline" } } }
      responses:
        "200": { description: "{calibrated, baseline} (accepted/issues are not stored)" }
        "400": { description: "invalid_baseline: malformed, non-finite number, or goal.torsoAngle missing" }
        "422": { description: "posture_not_good (error.issues lists why): the model said accepted=false OR the back angle is outside the allowed range; nothing stored" }
  /metrics:
    get:
      summary: Aggregates for analytics
      security: [{ dashboardToken: [] }]
      parameters:
        - { name: range, in: query, schema: { type: string, enum: [day, week, month], default: day } }
        - { name: tzOffsetMin, in: query, schema: { type: integer, default: 0 }, description: "-new Date().getTimezoneOffset()" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Metrics" } } } }
  /checkins:
    get:
      summary: The user's weekly pain check-ins, newest first (max 52)
      security: [{ dashboardToken: [] }]
      responses: { "200": { description: "{checkins: [{id, t, pain, area}]}" } }
    post:
      summary: Record a weekly pain check-in (server time). Used only for the user's own comparison, never for predictions
      security: [{ dashboardToken: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [pain]
              properties:
                pain: { type: integer, minimum: 0, maximum: 10 }
                area: { type: string, enum: [neck, upper_back, lower_back, shoulders, other], description: optional }
      responses:
        "200": { description: "{checkin: {id, t, pain, area}}" }
        "400": { description: invalid_checkin }
  /insights/pain:
    get:
      summary: Each check-in paired with the share of seated time slouching in the 7 days before it, plus a hedged Spearman rank correlation once there are 5+ weekly points (kept 6+ days apart). A pattern in the user's own data, not a cause
      security: [{ dashboardToken: [] }]
      responses:
        "200":
          description: >
            {points: [{t, pain, area, slouchPct|null, seatedSec, used}], lastCheckinAt, nextSuggestedAt,
            correlation: {enough, n, needed, rho|null, strength: none|modest|stronger|null, direction: positive|negative|null}}
  /export:
    get:
      summary: De-identified weekly aggregates (last 12 weeks) plus check-ins by week. No user id, tokens, device details or timestamps finer than a day. Generated for the user to download; nothing is sent anywhere
      security: [{ dashboardToken: [] }]
      parameters:
        - { name: tzOffsetMin, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200": { description: "{kind: sitwise-weekly-export, generated, weeks: [{weekStart, seatedMinutes, goodPct, slouchPct, slouchEpisodes}], checkins: [{weekStart, pain, area}], note}" }
  /focus:
    post:
      summary: Start (1-240 minutes) or stop (0) a focus session. The end time is set from server time
      security: [{ dashboardToken: [] }]
      requestBody:
        content: { application/json: { schema: { type: object, required: [minutes], properties: { minutes: { type: integer, minimum: 0, maximum: 240 } } } } }
      responses:
        "200": { description: "{settings, focusUntilMs}" }
        "400": { description: invalid_focus }
  /segments:
    get:
      summary: Raw posture segments for the last N days as [startMs, endMs, code] (G good, D drifting, S slouching, A away). The dashboard overlays a calendar file on them locally; the calendar never reaches the server
      security: [{ dashboardToken: [] }]
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 30, default: 14 } }
      responses:
        "200": { description: "{since, until, segments: [[startMs, endMs, G|D|S|A]]}" }
        "400": { description: bad_request }
  /coach/insights:
    get:
      summary: The personal coaching pack, computed from the user's own last 42 days with no AI and no identifiers (fatigue curve, how they slouch, response to nudges, habit strength, breaks, setup hints, exercises, suggested settings changes) plus the exercise library and whether Gemini is configured
      security: [{ dashboardToken: [] }]
      parameters:
        - { name: tzOffsetMin, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200": { description: "{pack: CoachPack, library: Exercise[] (with steps and safety note), ai: {configured, model|null}}. See web/src/types.ts CoachPack" }
  /coach/preview:
    get:
      summary: Exactly what would be sent to Gemini (the de-identified pack, no exercise steps), plus the plain-language disclosure. Sends nothing
      security: [{ dashboardToken: [] }]
      parameters:
        - { name: tzOffsetMin, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200": { description: "{payload, bytes, disclosure: string[], ai: {configured, model|null}}" }
  /coach/analyze:
    post:
      summary: >
        Build the coaching profile with Gemini from the de-identified pack. Needs consent: true in the body.
        The result is returned to the browser and is NOT stored on the server (the profile lives only in the browser).
        Never includes pain check-ins, identifiers, dates or images. Rate limited per user.
      security: [{ dashboardToken: [] }]
      requestBody:
        content: { application/json: { schema: { type: object, required: [consent], properties: { consent: { type: boolean, enum: [true] } } } } }
      responses:
        "200": { description: "{analysis: Analysis, model, sent: <the exact payload>}" }
        "400": { description: consent_required }
        "429": { description: rate_limited }
        "502": { description: "ai_bad_output | ai_unavailable (generic message, no provider detail)" }
        "503": { description: ai_not_configured (GEMINI_API_KEY unset) }
  /coach/ask:
    post:
      summary: Ask a free-text question about the user's own habits; answered from the de-identified pack and the cited evidence only. Needs consent=true. Nothing stored
      security: [{ dashboardToken: [] }]
      requestBody:
        content: { application/json: { schema: { type: object, required: [question, consent], properties: { question: { type: string, minLength: 3, maxLength: 300 }, consent: { type: boolean, enum: [true] } } } } }
      responses:
        "200": { description: "{answer, basedOn: string[], outOfScope}" }
        "400": { description: "bad_request | consent_required" }
        "429": { description: rate_limited }
        "502": { description: "ai_bad_output | ai_unavailable" }
        "503": { description: ai_not_configured }
  /coach/settings-from-text:
    post:
      summary: Turn a sentence about the user's day into a PROPOSED settings change, validated with the same code as PUT /settings. Never applied here; the dashboard shows the diff and the user confirms with PUT /settings. Sends the sentence and the current nudge settings only (no posture data). Needs consent=true
      security: [{ dashboardToken: [] }]
      requestBody:
        content: { application/json: { schema: { type: object, required: [text, consent], properties: { text: { type: string, minLength: 3, maxLength: 400 }, consent: { type: boolean, enum: [true] } } } } }
      responses:
        "200": { description: "{explanation, patch, changes: [{field, from, to}]}" }
        "400": { description: "bad_request | consent_required" }
        "429": { description: rate_limited }
        "502": { description: "ai_bad_output | ai_unavailable" }
        "503": { description: ai_not_configured }
  /push/web/public-key:
    get:
      summary: VAPID public key for the browser (public by design)
      responses: { "200": { description: "{publicKey|null}" } }
  /push/web/subscribe:
    post:
      summary: Save a Web Push subscription
      security: [{ dashboardToken: [] }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { subscription: { type: object } } } } }
      responses: { "200": { description: "{ok}" } }
  /push/web/receiver/pairing:
    post:
      summary: Create a 10-minute code to connect an additional phone as a push-only receiver
      security: [{ dashboardToken: [] }]
      responses: { "200": { description: "{code, expiresAt}" } }
  /push/web/receiver/claim:
    post:
      summary: Exchange a one-time receiver code for a limited receiver token
      requestBody:
       content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string } } } } }
      responses: { "200": { description: "{receiverToken}" }, "404": { description: "invalid_code" } }
  /push/web/receiver/subscribe:
    post:
      summary: Register the receiver phone's Web Push subscription (does not grant dashboard access)
      security: [{ receiverToken: [] }]
      requestBody:
       content: { application/json: { schema: { type: object, properties: { subscription: { type: object } } } } }
      responses: { "200": { description: "{ok}" } }
  /push/web/receiver/unsubscribe:
    post:
      summary: Remove the receiver phone's Web Push subscription
      security: [{ receiverToken: [] }]
      requestBody:
       content: { application/json: { schema: { type: object, required: [endpoint], properties: { endpoint: { type: string } } } } }
      responses: { "200": { description: "{ok}" } }
  /push/apns/register:
    post:
      summary: Save the APNs device token (sandbox flag = dev build)
      security: [{ deviceToken: [] }]
      requestBody:
        content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string }, sandbox: { type: boolean } } } } }
      responses: { "200": { description: "{ok}" } }
  /push/test:
    post:
      summary: Send a test notification to the phone (APNs and phone receivers) or desktop channel
      security: [{ dashboardToken: [] }]
      requestBody:
        content: { application/json: { schema: { type: object, required: [channel], properties: { channel: { type: string, enum: [phone, desktop] } } } } }
      responses: { "200": { description: "{channel, result: ChannelResult}" } }
  /dev/seed:
    post:
      summary: Seed fake history (404 unless ENABLE_DEV_ROUTES=1). No token = create a new demo user.
      requestBody:
        content: { application/json: { schema: { type: object, properties: { days: { type: integer, default: 14, maximum: 90 }, tzOffsetMin: { type: integer }, reset: { type: boolean, default: true }, seed: { type: integer } } } } }
      responses: { "200": { description: "{events, samples, days, checkins, dashboardToken?, pairingCode?} (also seeds one demo pain check-in per week of history, downsampled readings with features, and an aged calibration)" } }
  /model/analyze:
    post:
      summary: "STUB: server-side fallback classification. ?force=slouch returns SLOUCHING"
      security: [{ dashboardToken: [] }, { deviceToken: [] }]
      responses: { "200": { description: "A PostureSample-shaped body plus stub: true" } }
  /model/calibrate/start:
    post:
      summary: "STUB: begin capturing goal posture"
      security: [{ dashboardToken: [] }, { deviceToken: [] }]
      responses: { "200": { description: '{"status":"started","stub":true}' } }
  /model/calibrate/finish:
    post:
      summary: "Finish calibration. While a real model is streaming to this account (bridge/), averages the last 10 s of its live readings and judges visibility and steadiness (stub: false); otherwise a STUB mock baseline. ?force=bad always simulates the model rejecting the posture"
      security: [{ dashboardToken: [] }, { deviceToken: [] }]
      parameters:
        - { name: force, in: query, schema: { type: string, enum: [bad] }, description: "bad => accepted=false with issues" }
      responses: { "200": { description: "CalibrationBaseline (with accepted/issues) plus stub: true" } }
  /model/health:
    get:
      summary: "Is the model ready? stub is false and live is true only while a real model is streaming to this account"
      security: [{ dashboardToken: [] }, { deviceToken: [] }]
      responses: { "200": { description: '{ready, stub, live, source|null}' } }
