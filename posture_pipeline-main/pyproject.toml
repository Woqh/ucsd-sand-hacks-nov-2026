[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multiposture-baseline"
version = "0.1.0"
description = "Participant-separated MultiPosture CNN baseline with validity-aware camera measurements"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==1.26.4", "torch==2.6.0", "scikit-learn==1.6.1", "mediapipe==0.10.21", "opencv-contrib-python==4.11.0.86"]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[tool.setuptools.packages.find]
include = ["posture*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
